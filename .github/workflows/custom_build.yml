name: Build Xiaozhi Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        shell: bash
        env:
          BOARD: bread-compact-wifi
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py "$BOARD" --name bread-compact-wifi

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-firmware
          path: build/merged-binary.bin
