name: Build Xiaozhi Firmware

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v6.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build firmware
        shell: bash
        env:
          BOARD: bread-compact-wifi
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py "$BOARD" --name bread-compact-wifi

      - name: Prepare files
        run: |
          mkdir -p output
          cp build/xiaozhi.bin output/ 2>/dev/null || true
          cp build/merged-binary.bin output/ 2>/dev/null || true
          ls -lh output/

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Build"
          body: "Auto-built from commit ${{ github.sha }}"
          files: |
            output/xiaozhi.bin
            output/merged-binary.bin
